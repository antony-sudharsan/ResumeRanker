[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "resume-ranker"
version = "0.1.0"
description = "A utility to rank job candidates based on technology skills, experience, and roles & responsibilities"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.27.0",
    "python-multipart>=0.0.9",
    "pdfplumber>=0.11.0",
    "python-docx>=1.1.0",
    "scikit-learn>=1.4.0",
    "jinja2>=3.1.0",
    "sentence-transformers>=3.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "httpx>=0.27.0",
    "ruff>=0.3.0",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.vercel]
entrypoint = "resume_ranker.main:app"
